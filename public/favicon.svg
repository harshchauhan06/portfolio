<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .head-bg { fill: #050505; }
    .code-symbol { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .head-bg { fill: #ffffff; }
      .code-symbol { stroke: #050505; }
    }
  </style>

  <!-- Head Silhouette -->
  <path class="head-bg" d="
    M 24 94 
    L 24 60 
    C 24 28, 32 8, 54 8 
    C 74 8, 86 24, 86 40 
    C 86 46, 88 50, 93 53 
    C 96 55, 96 57, 91 59 
    C 84 62, 80 63, 82 68 
    C 84 71, 87 72, 85 76 
    C 81 81, 74 84, 63 86 
    L 63 94 
    Z" 
  />

  <!-- Inside Code Symbol: </ > -->
  <g class="code-symbol" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- < -->
    <path d="M 37 36 L 25 44 L 37 52" />
    <!-- / -->
    <path d="M 48 55 L 55 33" />
    <!-- > -->
    <path d="M 64 36 L 76 44 L 64 52" />
  </g>
</svg>
